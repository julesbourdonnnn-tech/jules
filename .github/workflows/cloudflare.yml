# Met le site en ligne sur Cloudflare Pages à chaque modification.
# Prérequis (une seule fois) : dans GitHub → Settings → Secrets and variables
# → Actions, ajouter CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare

on:
  push:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: nuits-singulieres

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier les clés Cloudflare
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Clés Cloudflare absentes : ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans les secrets du dépôt."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Préparer le site
        if: steps.keys.outputs.ok == 'true'
        run: node scripts/build.js && node scripts/dist.js
      - name: Créer le projet Cloudflare Pages (première fois)
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch production || echo "Projet déjà existant"
      - name: Mettre en ligne
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch production --commit-dirty=true
          echo "### ✦ Site en ligne : https://$PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
