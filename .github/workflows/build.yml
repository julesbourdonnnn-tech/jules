# Régénère les pages statiques (fiches, guides, plan du site) quand les
# données changent, puis enregistre le résultat dans le dépôt.
name: Build

on:
  push:
    paths:
      - "js/config.js"
      - "js/hotels.js"
      - "js/guides.js"
      - "js/core.js"
      - "scripts/build.js"
      - "index.html"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build.js
      - name: Enregistrer les pages générées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- hotels guides index.html sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Pages déjà à jour"; exit 0; fi
          git commit -m "Build : pages statiques régénérées"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
