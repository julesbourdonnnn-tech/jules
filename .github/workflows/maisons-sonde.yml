# Temporaire : sonde des prix Airbnb (voir maisons/scripts/sonde_prix.py)
name: Maisons — sonde prix
on:
  push:
    paths: ["maisons/scripts/sonde_prix.py", ".github/workflows/maisons-sonde.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python maisons/scripts/sonde_prix.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f -- maisons/data/airbnb/sonde
          git commit -m "Maisons : sonde prix Airbnb" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
