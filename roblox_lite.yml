# Déclaration légère des globales Roblox pour Selene (complète le std « luau »).
base: luau
name: roblox_lite
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  plugin:
    any: true
  shared:
    any: true
  Enum:
    any: true
  Instance:
    any: true
  Vector2:
    any: true
  Vector3:
    any: true
  Vector2int16:
    any: true
  Vector3int16:
    any: true
  CFrame:
    any: true
  Color3:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Rect:
    any: true
  Ray:
    any: true
  RaycastParams:
    any: true
  OverlapParams:
    any: true
  Region3:
    any: true
  BrickColor:
    any: true
  TweenInfo:
    any: true
  PhysicalProperties:
    any: true
  Font:
    any: true
  Random:
    any: true
  DateTime:
    any: true
  Axes:
    any: true
  Faces:
    any: true
  PathWaypoint:
    any: true
  CatalogSearchParams:
    any: true
  SharedTable:
    any: true
  task:
    any: true
  tick:
    args: []
  time:
    args: []
  elapsedTime:
    args: []
  wait:
    args:
      - required: false
        type: number
  delay:
    args:
      - type: number
      - type: function
  spawn:
    args:
      - type: function
  warn:
    args:
      - type: "..."
  typeof:
    args:
      - type: any
  settings:
    args: []
  UserSettings:
    args: []
  version:
    args: []
