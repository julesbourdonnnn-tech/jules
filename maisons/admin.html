<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Réservations | Sable &amp; Pierre</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
  <header class="header header--dark is-solid">
    <div class="wrap">
      <a class="brand" href="./"><span>Sable <em>&amp;</em> Pierre</span></a>
      <nav class="nav" aria-label="Navigation principale"><a href="lacanau.html">Lacanau</a><a href="bordeaux.html">Bordeaux</a></nav>
    </div>
  </header>
  <main class="page" id="main">
    <div class="wrap">
      <span class="eyebrow">Espace propriétaire</span>
      <h1 class="h1" style="margin-top:18px">Réservations</h1>
      <form class="admin-login" id="login">
        <div class="field"><label for="a-key">Mot de passe</label><input id="a-key" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--accent" type="submit">Entrer</button>
        <p class="booking__msg" id="login-msg" aria-live="polite"></p>
      </form>
      <div id="admin" hidden>
        <div class="admin-bar">
          <div class="admin-tabs" role="tablist" aria-label="Filtrer">
            <button type="button" class="chip" data-f="a_valider" aria-pressed="true">À valider</button>
            <button type="button" class="chip" data-f="confirmee" aria-pressed="false">Confirmées</button>
            <button type="button" class="chip" data-f="autres" aria-pressed="false">Refusées, annulées, abandonnées</button>
          </div>
          <button type="button" class="btn btn--ghost" id="refresh">Actualiser</button>
        </div>
        <div id="alerts"></div>
        <div class="admin-list" id="list" aria-live="polite"></div>
        <details class="admin-help">
          <summary>Synchroniser avec Airbnb (à faire une fois)</summary>
          <p>Pour qu'Airbnb bloque automatiquement les dates réservées ici, ajoute ce lien dans Airbnb : Calendrier de l'annonce → Disponibilités → Connecter des calendriers → Importer un calendrier.</p>
          <div id="feeds"></div>
        </details>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/prix.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
