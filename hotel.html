<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirection — Nuits Singulières</title>
  <meta name="robots" content="noindex">
  <script>
    // Ancienne adresse des fiches (hotel.html?id=…) : redirige vers la page de l'établissement
    (function () {
      var p = new URLSearchParams(location.search);
      var id = (p.get("id") || "").replace(/[^a-z0-9-]/gi, "");
      p.delete("id");
      var rest = p.toString();
      location.replace(id ? "hotels/" + id + ".html" + (rest ? "?" + rest : "") : "index.html#explorer");
    })();
  </script>
</head>
<body>
  <p><a href="index.html">Nuits Singulières — voir tous les établissements</a></p>
</body>
</html>
