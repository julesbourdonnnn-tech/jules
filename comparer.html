<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparer des lieux insolites — Nuits Singulières</title>
  <meta name="description" content="Comparez côte à côte jusqu'à trois lieux insolites : budget, hébergement, envies, équipements et disponibilités.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1a17">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="compare-page">
  <a class="skip" href="#comparateur">Aller au comparateur</a>
  <header id="site-header" class="site-header on-dark"></header>

  <main>
    <section class="p-hero">
      <div class="container">
        <p class="eyebrow">Le comparateur</p>
        <h1>Hésiter, c'est déjà rêver</h1>
        <p class="lead">Jusqu'à trois lieux côte à côte : budget, hébergement, envies et équipements, pour choisir en toute sérénité.</p>
      </div>
    </section>

    <section class="section container" id="comparateur">
      <form class="stay stay-bar" data-stay data-empty="Ajoutez vos dates : les boutons « Voir les prix » afficheront les tarifs de votre séjour." autocomplete="off">
        <p class="stay-bar-title">Vos dates</p>
        <div class="stay-dates">
          <label><span>Arrivée</span><input type="date" name="checkin" aria-label="Date d'arrivée"></label>
          <label><span>Départ</span><input type="date" name="checkout" aria-label="Date de départ"></label>
        </div>
        <p class="stay-note" data-stay-note aria-live="polite"></p>
        <button type="button" class="btn-text stay-clear" data-stay-clear>Effacer</button>
      </form>
      <div id="compare-root" aria-live="polite"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/hotels.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/core.js"></script>
  <script src="js/common.js"></script>
  <script src="js/comparer.js"></script>
</body>
</html>
